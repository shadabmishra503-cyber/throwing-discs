name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # No committed wrapper needed: Gradle 9.6.0 is installed directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: throwing-discs-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Show jar contents
        run: unzip -l build/libs/throwing-discs-1.0.0.jar | grep -E "\.class|fabric.mod.json|recipe/|loot_table|textures"

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/throwing-discs-1.0.0.jar \
            --title "Throwing Discs build ${{ github.run_number }} (Minecraft 26.3)" \
            --notes "Fabric mod jar for Minecraft Java 26.3. Needs Fabric Loader 0.19.5+ and Fabric API 0.165.0+26.3."

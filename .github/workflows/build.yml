name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # No committed wrapper needed: Gradle 9.6.0 is installed directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build
        run: gradle build --stacktrace

      - name: Inspect APIs (diagnostic)
        if: always()
        continue-on-error: true
        run: |
          set +e
          MC=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          FJ=$(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' | tr '\n' ':')
          CP="$MC:$FJ"
          for c in 'net.minecraft.world.level.storage.loot.LootPool$Builder' 'net.minecraft.world.level.storage.loot.LootTable$Builder' net.minecraft.world.level.storage.loot.entries.LootItem net.minecraft.world.level.storage.loot.functions.EnchantWithLevelsFunction net.minecraft.world.level.storage.loot.predicates.LootItemRandomChanceCondition net.minecraft.world.level.storage.loot.providers.number.ints.ConstantValue net.minecraft.world.level.storage.loot.providers.number.ints.UniformGenerator net.minecraft.world.level.storage.loot.providers.number.floats.ConstantValue net.fabricmc.fabric.api.creativetab.v1.CreativeModeTabEvents 'net.fabricmc.fabric.api.creativetab.v1.CreativeModeTabEvents$ModifyOutput' net.fabricmc.fabric.api.creativetab.v1.FabricCreativeModeTabOutput 'net.fabricmc.fabric.api.loot.v3.LootTableEvents$Modify' net.fabricmc.fabric.api.loot.v3.LootTableEvents net.fabricmc.fabric.api.client.rendering.v1.EntityRendererRegistry net.minecraft.world.entity.Entity net.minecraft.world.item.enchantment.EnchantmentHelper; do
            echo "-- $c"; javap -public -cp "$CP" "$c" 2>&1 | grep -v -E "^Compiled|^$" | cut -c1-300 | grep -E "Builder|withPool|setRolls|add\(|lootTableItem|enchantWithLevels|randomChance|exactly|between|register|modify|Event|accept|void |push\(|is\(|class |interface " | head -25
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: throwing-discs-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
